<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Deep-dive engineering guides on C#/.NET, Azure, AWS, Docker, Kubernetes, SQL, design patterns and more.">
  <!-- Both are re-written at runtime by ThemeService; these are the values for the light
       palette, which is what the pre-boot script below falls back to. -->
  <meta name="theme-color" content="#f6f7f9">
  <meta name="color-scheme" content="light dark">
  <title>Content Blog — Engineering Knowledge Base</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!--
    Paint the theme before Angular boots.

    ThemeService applies `data-theme` in its constructor, but that runs after the bundle has been
    fetched, parsed and bootstrapped — long enough for a dark-mode reader to get a full white
    flash on every cold load. This reproduces exactly its resolution order (stored choice, else
    the OS preference) in a few lines, and fails silently to the light default: it is the same
    guard the service needs, because a browser that blocks site data throws on the accessor.
  -->
  <script>
    (function () {
      try {
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) { /* storage blocked */ }
        var dark = stored === 'dark' ||
          ((stored === null || stored === 'system') &&
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0b0f17' : '#f6f7f9');
      } catch (e) { /* the light default stands */ }
    })();
  </script>

  <!--
    Admin API endpoint. This is NOT a secret — it's just a public URL, safe to commit.
    For local dev the app defaults to http://localhost:5080/api. For the GitHub Pages
    build, point it at your Render backend by uncommenting and editing the line below.
  -->
  <script>window.__ADMIN_API_BASE__ = 'https://content-blog-nms8.onrender.com/api';</script>
  <!--
    Central identity provider (admin.keshavsingh.in). The console gets its session from here via
    the shared SSO cookie. __IDP_API_BASE__ must be a keshavsingh.in subdomain so the cookie is
    sent; __ADMIN_APP_URL__ is the IdP SPA used for interactive sign-in redirects.
  -->
  <script>
    window.__IDP_API_BASE__ = 'https://id.keshavsingh.in/api';
    window.__ADMIN_APP_URL__ = 'https://admin.keshavsingh.in';
  </script>
  <app-root></app-root>
</body>
</html>
