<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Deep-dive engineering guides on C#/.NET, Azure, AWS, Docker, Kubernetes, SQL, design patterns and more.">
  <!-- Both are re-written at runtime by ThemeService; these are the values for the light
       palette, which is what the pre-boot script below falls back to. -->
  <meta name="theme-color" content="#f6f7f9">
  <meta name="color-scheme" content="light dark">
  <title>Content Blog — Engineering Knowledge Base</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <meta name="google-adsense-account" content="ca-pub-7890828429175364">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7890828429175364" crossorigin="anonymous"></script>
</head>
<body>
  <!--
    Paint the theme before Angular boots.

    ThemeService applies `data-theme` in its constructor, but that runs after the bundle has been
    fetched, parsed and bootstrapped — long enough for a dark-mode reader to get a full white
    flash on every cold load. This reproduces exactly its resolution order (stored choice, else
    the OS preference) in a few lines, and fails silently to the light default: it is the same
    guard the service needs, because a browser that blocks site data throws on the accessor.
  -->
  <script>
    (function () {
      try {
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) { /* storage blocked */ }
        var dark = stored === 'dark' ||
          ((stored === null || stored === 'system') &&
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0b0f17' : '#f6f7f9');
      } catch (e) { /* the light default stands */ }
    })();
  </script>

  <!--
    Admin API endpoint. This is NOT a secret — it's just a public URL, safe to commit.
    For local dev the app defaults to http://localhost:5080/api. For the GitHub Pages
    build, point it at your Render backend by uncommenting and editing the line below.
  -->
  <script>window.__ADMIN_API_BASE__ = 'https://content-blog-nms8.onrender.com/api';</script>
  <!--
    Central identity provider (admin.keshavsingh.in). The console gets its session from here via
    the shared SSO cookie. __IDP_API_BASE__ must be a keshavsingh.in subdomain so the cookie is
    sent; __ADMIN_APP_URL__ is the IdP SPA used for interactive sign-in redirects.
  -->
  <script>
    window.__IDP_API_BASE__ = 'https://id.keshavsingh.in/api';
    window.__ADMIN_APP_URL__ = 'https://admin.keshavsingh.in';
  </script>
  <style id="boot-loader-style">
    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #f6f7f9;
      color: #0f172a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.22s ease;
    }
    :root[data-theme='dark'] #boot-loader {
      background: #0b1020;
      color: #e2e8f0;
    }
    #boot-loader.boot-hide {
      opacity: 0;
      pointer-events: none;
    }
    .boot-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: bootSpin 0.75s linear infinite;
    }
    :root[data-theme='dark'] .boot-spinner {
      border-color: rgba(129, 140, 248, 0.22);
      border-top-color: #818cf8;
    }
    .boot-label {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      opacity: 0.85;
    }
    @keyframes bootSpin {
      to { transform: rotate(360deg); }
    }
  </style>
  <div id="boot-loader" role="status" aria-live="polite" aria-label="Loading Content Blog">
    <div class="boot-spinner" aria-hidden="true"></div>
    <div class="boot-label">Loading Content Blog…</div>
  </div>
  <app-root></app-root>
</body>
</html>
