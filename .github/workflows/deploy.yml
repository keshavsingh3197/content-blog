name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # GITHUB_TOKEN gets exactly the scopes listed here and nothing more. Without this, npm's read of the
  # private @keshavsingh3197/* packages is refused even though the token is wired into the install step.
  packages: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate structure.json
        run: python3 generate_structure.py

      # The private @keshavsingh3197/* packages come from GitHub Packages. The committed .npmrc
      # references ${PACKAGES_READ_TOKEN}; without it npm sends an empty credential and the registry
      # answers 401 for every scoped package. GITHUB_TOKEN works here because this repo and the
      # package repo share an owner.
      - env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: npm ci --legacy-peer-deps

      - run: npx ng build --base-href /

      - name: Copy index.html as 404.html for SPA routing
        run: cp dist/browser/index.html dist/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
