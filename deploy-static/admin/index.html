<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to the admin console…</title>
  <!-- The app uses hash routing, so the real admin URL is /#/admin/login.
       GitHub Pages serves this file for the clean /admin path and bounces
       the browser to the hash route. -->
  <meta http-equiv="refresh" content="0; url=/#/admin/login">
  <meta name="robots" content="noindex">
  <script>location.replace('/#/admin/login');</script>
</head>
<body>
  Redirecting to <a href="/#/admin/login">the admin console</a>…
</body>
</html>
